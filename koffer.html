<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./scss/main.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <title class="page-title">Koffer</title>
</head>
<body x-data="temp">

    <!-- HEADER -->
    <header x-html="header" class="header"></header>

    <!-- MAIN CONENT -->
    <main class="main_container">

        <!-- LINKER NAVIGATIE  -->
        <section class='nav_left' id='left-nav' x-html="leftnav"></section>

        <!-- MIDDEN CONTENT --> 
        <section class='mid_content' id='content'>

            <!-- HIER WORD CONTENT TUSSEN GEPLAATST-->
            <div class="main_content" id="container" >

                <!-- KOFFER -->
                <div class="koffer">
                    <h3>Koffer</h3>
                    <!-- KOFFER ZOEK KNOPPEN -->
                    <div class="koffer_btns">
                        <button class="register_btn">Alles</button>
                        <button class="register_btn">Boeken</button>
                        <button class="register_btn">Gewaden</button>
                        <button class="register_btn">Hoeden</button>
                        <button class="register_btn">Toverstokken</button>
                        <button class="register_btn">Bezems</button>
                    </div>

                    <!-- KOFFER ITEMS & INFO -->
                    <div class="koffer_container">
                        
                        <div class="koffer_items_lijst">
                            <h3>Voorwerpen</h3>
                            <div class="koffer_info">
                                <ul>
                                    <li>Koffertype:</li>
                                    <li>Aantal voorwerpen:</li>
                                </ul>
                                <ul>
                                    <li id="js_koffer_naam">Standaard Koffer</li>
                                    <li><span id="js_aantal_voorwerpen"></span>/<span id="js_max_voorwerpen"></span></li>
                                </ul>
                            </div>
                            <!-- ITEMS -->
                            <div class="items_container">
                                <button type="button"><img src="./assets/items/frog.svg" alt=""></button>
                                <button type="button"><img src="./assets/items/frog.svg" alt=""></button>
                                <button type="button"><img src="./assets/items/frog.svg" alt=""></button>
                                <button type="button"><img src="./assets/items/frog.svg" alt=""></button>
                                <button type="button"><img src="./assets/items/frog.svg" alt=""></button>
                            </div>
                        </div>

                        <!-- PREVIEW ITEMS -->
                        <div class="koffer_items_preview">
                            <h3>Overzicht</h3>
                            <div class="preview_container">
                                <!-- PREVIEW -->
                                <div class="preview">
                                    <h4>Robe</h4>
                                    <div class="preview_img">
                                        <img src="./assets/items/robe.svg" alt="">
                                    </div>
                                </div>
                                <!-- PREVIEW INFO -->
                                <div class="preview_info">
                                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
                                    <ul>
                                        <li>lijst</li>
                                        <li>lijst</li>
                                        <li>lijst</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        
                    </div>
                </div>

            </div>

        </section>

        <!-- RECHTER NAVIGATIE  -->
        <section class='nav_right' id='right-nav' x-html="rightnav"></section>

    </main>

    <!-- FOOTER -->
    <footer x-html="footer" class="footer"></footer>
    
    
    <!-- JS SCRIPTS -->
    <script src="js/main.min.js"></script>
</body>

</html>
